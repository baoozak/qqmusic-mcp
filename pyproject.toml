[project]
name = "qqmusic-mcp"
version = "1.1.0"
description = "A local MCP server for safely managing a QQ Music personal library"
readme = "README.md"
license = "MIT"
authors = [{ name = "baoozak" }]
requires-python = ">=3.11"
keywords = ["mcp", "qq-music", "music", "playlist", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "playwright>=1.58,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-anyio>=0.0.0",
]

[project.scripts]
qqmusic-mcp = "qqmusic_organizer.cli:main"

[project.urls]
Homepage = "https://github.com/baoozak/qqmusic-mcp"
Repository = "https://github.com/baoozak/qqmusic-mcp"
Issues = "https://github.com/baoozak/qqmusic-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqmusic_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
